name: Build & Release

# Compila o app e o instalador direto do código-fonte, nas máquinas do GitHub.
# Ao criar uma tag (ex.: v1.0.0) publica uma Release com os arquivos + hashes SHA-256
# e uma "attestation" assinada que prova que os binários vieram deste repositório.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build app
        run: dotnet build MonitorHub.csproj -c Release -o out

      - name: Build installer + hashes
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          Copy-Item out/MonitorHub.exe .
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$v installer/MonitorHub.nsi
          Get-FileHash MonitorHub.exe, installer/MonitorHub-Setup-*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            MonitorHub.exe
            installer/MonitorHub-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorHub
          path: |
            MonitorHub.exe
            installer/MonitorHub-Setup-*.exe
            SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MonitorHub.exe
            installer/MonitorHub-Setup-*.exe
            SHA256SUMS.txt
